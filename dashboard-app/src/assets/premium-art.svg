<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="presentation">
  <!-- Stand-in for src/assets/premium-art.png: a wide (2:1) composition whose
       subject sits on the right, so it fills the dark card the same way the
       real illustration does (cover + object-right + screen blend). -->
  <g stroke="#ffffff" stroke-linecap="round">
    <!-- quiet scatter on the left, mostly hidden by the card's text mask -->
    <g stroke-width="1.4" opacity="0.18">
      <path d="M52 60v14M45 67h14" />
      <circle cx="112" cy="150" r="7" />
      <path d="M84 92h20M84 104h20M84 116h20" />
    </g>

    <!-- the composition, right of centre -->
    <circle cx="298" cy="100" r="62" stroke-width="1.4" opacity="0.22" />
    <circle cx="298" cy="100" r="78" stroke-width="1.1" opacity="0.12" />

    <!-- heart -->
    <path
      d="M298 140c-17-11.5-29-23.6-29-36.8 0-9.6 7.2-17.2 16.3-17.2 5.5 0 10 2.9 12.7 6.7 2.7-3.8 7.2-6.7 12.7-6.7 9.1 0 16.3 7.6 16.3 17.2 0 13.2-12 25.3-29 36.8Z"
      stroke-width="3"
      opacity="0.95"
    />
    <path d="M298 100c-4.4 0-8 3.4-8 7.6 0 5.6 4.8 10.4 11.2 15.2" stroke-width="1.7" opacity="0.5" />

    <!-- vessels -->
    <path d="M298 81c0-11 3.6-18 11.5-24.6" stroke-width="2.4" opacity="0.85" />
    <path d="M309.5 56.4c5.5-2.4 10.8-1.8 14.8 2" stroke-width="2.2" opacity="0.7" />
    <path d="M298 81c-1.6-10.4-6.6-16.4-14.4-21" stroke-width="2.2" opacity="0.7" />
    <path d="M283.6 60c-5.2-4-11-5.2-16-2.6" stroke-width="1.9" opacity="0.55" />

    <!-- vertebrae column, tucked at the inner edge -->
    <g stroke-width="1.7" opacity="0.45">
      <path d="M214 62h22M214 76h22M214 90h22M214 104h22M214 118h22" />
      <path d="M214 62v56" opacity="0.5" />
      <path d="M236 62v56" opacity="0.5" />
    </g>

    <!-- cells -->
    <g stroke-width="1.7" opacity="0.6">
      <path d="M372 44v12M366 50h12" />
      <circle cx="380" cy="152" r="5.5" />
      <circle cx="248" cy="34" r="4.5" />
      <path d="M196 152v9M191.5 156.5h9" />
    </g>
  </g>
</svg>
