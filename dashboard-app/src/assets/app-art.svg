<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 112" fill="none" role="presentation">
  <!-- stacked study cards for the green promo tile -->
  <g transform="rotate(-11 48 66)">
    <rect x="14" y="30" width="64" height="74" rx="10" fill="#ffffff" opacity="0.55" />
    <rect x="14" y="30" width="64" height="74" rx="10" stroke="#1b1d18" stroke-width="2" opacity="0.35" />
    <path d="M28 50h30M28 60h22" stroke="#1b1d18" stroke-width="2.4" opacity="0.28" stroke-linecap="round" />
  </g>

  <g transform="rotate(7 106 64)">
    <rect x="70" y="16" width="78" height="90" rx="12" fill="#ffffff" />
    <rect x="70" y="16" width="78" height="90" rx="12" stroke="#1b1d18" stroke-width="2.4" />

    <!-- header pill -->
    <rect x="80" y="26" width="32" height="9" rx="4.5" fill="#1b1d18" />

    <!-- heart -->
    <path
      d="M97 58c-7-4.8-11.6-9.6-11.6-15.1 0-4 3-7.1 6.7-7.1 2.2 0 4 1.1 4.9 2.7.9-1.6 2.7-2.7 4.9-2.7 3.7 0 6.7 3.1 6.7 7.1 0 5.5-4.6 10.3-11.6 15.1Z"
      fill="#e2574c"
    />
    <path d="M97 40.6c0-3.6 1.3-6.2 3.8-8.6" stroke="#e2574c" stroke-width="2.6" stroke-linecap="round" />

    <!-- bone -->
    <g fill="#1b1d18" opacity="0.85">
      <rect x="110" y="72" width="3.4" height="20" rx="1.7" />
      <circle cx="108.4" cy="70" r="3.6" />
      <circle cx="115" cy="70" r="3.6" />
      <circle cx="108.4" cy="94" r="3.6" />
      <circle cx="115" cy="94" r="3.6" />
    </g>

    <!-- progress bar -->
    <rect x="80" y="86" width="58" height="8" rx="4" fill="#1b1d18" opacity="0.16" />
    <rect x="80" y="86" width="36" height="8" rx="4" fill="#46a302" />
  </g>
</svg>
